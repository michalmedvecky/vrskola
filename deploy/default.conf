# nginx-unprivileged poslouchá na 8080 (UID 101). Statické soubory z ConfigMapy vrskola-web.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ať Quest po nasazení nové verze nedrží v cache starou hru.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Portréty do bludiště: vlastní ConfigMapa (vrskola-web by přerostla limit 1 MiB).
    location /portrety/ {
        alias /usr/share/nginx/portrety/;
    }

    # Sady zadání (co se procvičuje): vlastní ConfigMapa, ConfigMapa nemá podadresáře.
    location /sady/ {
        alias /usr/share/nginx/sady/;
    }

    # Přibalená písma sad (čínské znaky): vlastní ConfigMapa.
    location /pisma/ {
        alias /usr/share/nginx/pisma/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
