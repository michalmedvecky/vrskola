# nginx-unprivileged poslouchá na 8080 (UID 101). Statické soubory z ConfigMapy vrskola-web.
server {
    listen 8080;
    server_name _;
    # Za Traefikem (https:443) nesmí přesměrování obsahovat vnitřní http a port 8080: posílej jen cestu.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Ať Quest po nasazení nové verze nedrží v cache starou hru.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Portréty do bludiště: vlastní ConfigMapa (vrskola-web by přerostla limit 1 MiB).
    location /portrety/ {
        alias /usr/share/nginx/portrety/;
    }

    # Portréty matematiků (sada Malá násobilka): další vlastní ConfigMapa, vrskola-portrety se blíží 1 MiB.
    location /portrety-matematici/ {
        alias /usr/share/nginx/portrety-matematici/;
    }

    # Sady zadání (co se procvičuje): vlastní ConfigMapa, ConfigMapa nemá podadresáře.
    location /sady/ {
        alias /usr/share/nginx/sady/;
    }

    # Přibalená písma sad (čínské znaky): vlastní ConfigMapa.
    location /pisma/ {
        alias /usr/share/nginx/pisma/;
    }

    # Strážcy klýčú: samostatná hra pro tablet. Aplikace a její data (mapy, sady úkolů) jsou dvě ConfigMapy.
    # Původní adresa hry (Marketka).
    location ~ ^/marketka(/.*)?$ {
        return 301 /strazcy/;
    }
    location = /strazcy {
        return 301 /strazcy/;
    }
    location /strazcy/data/ {
        alias /usr/share/nginx/strazcy-data/;
    }
    location /strazcy/ {
        alias /usr/share/nginx/strazcy/;
        index index.html;
    }

    # Padám padám: hra na určování pádů pro tablet. Aplikace a její data (věty, slova) jsou dvě ConfigMapy.
    location = /padam {
        return 301 /padam/;
    }
    location /padam/data/ {
        alias /usr/share/nginx/padam-data/;
    }
    location /padam/ {
        alias /usr/share/nginx/padam/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
