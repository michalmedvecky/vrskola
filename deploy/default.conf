# nginx-unprivileged poslouchá na 8080 (UID 101). Statické soubory z ConfigMapy vrskola-web.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ať Quest po nasazení nové verze nedrží v cache starou hru.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
