# Nasazení VR školy do k3s. Žádný image se nestaví: soubory hry z web/ jdou do ConfigMapy
# a servíruje je neupravený nginx-unprivileged. Při změně web/ se změní hash ConfigMapy → Deployment se sám přerolluje.
#
# ConfigMapa má ~750 kB (víc než limit anotace last-applied), proto se aplikuje server-side:
#   kubectl apply --server-side -k .
# Flux (kustomize-controller) server-side apply používá sám.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vrskola
labels:
  - pairs:
      app.kubernetes.io/name: vrskola
    includeSelectors: true
resources:
  - deploy/namespace.yaml
  - deploy/deployment.yaml
  - deploy/service.yaml
  - deploy/ingress.yaml
  - deploy/api-pvc.yaml
  - deploy/api-deployment.yaml
  - deploy/api-service.yaml
configMapGenerator:
  - name: vrskola-web
    files:
      - web/index.html
      - web/sada.js
      - web/three.module.min.js
  - name: vrskola-sady      # sady zadání (co se procvičuje); hra je čte z /sady/, server souboje z /sady
    files:
      - web/sady/index.json
      - web/sady/vyjmenovana.json
      - web/sady/vybrane-slova.json
      - web/sady/sk-s-z.json
      - web/sady/sk-spodobovanie.json
      - web/sady/sk-ae.json
      - web/sady/sk-y-i.json
      - web/sady/sk-koncovky.json
      - web/sady/sk-makcene.json
      - web/sady/sk-dlzne.json
      - web/sady/sk-dvojhlasky.json
      - web/sady/sk-velke-pismena.json
      - web/sady/shoda.json
      - web/sady/prislovi-vyznam.json
      - web/sady/prislovi-slovo.json
      - web/sady/nasobilka.json
      - web/sady/anglictina.json
      - web/sady/cinstina.json
  - name: vrskola-portrety   # portréty do bludiště (~440 kB, české i slovenské), zvlášť kvůli limitu 1 MiB na ConfigMapu
    files:
      - web/portrety/hus.jpg
      - web/portrety/dobrovsky.jpg
      - web/portrety/jungmann.jpg
      - web/portrety/safarik.jpg
      - web/portrety/palacky.jpg
      - web/portrety/macha.jpg
      - web/portrety/nemcova.jpg
      - web/portrety/bernolak.jpg
      - web/portrety/stur.jpg
      - web/portrety/hurban.jpg
      - web/portrety/hodza.jpg
      - web/portrety/hattala.jpg
  - name: vrskola-portrety-matematici   # portréty matematiků pro sadu Malá násobilka (~330 kB), vlastní ConfigMapa kvůli limitu 1 MiB
    files:
      - web/portrety-matematici/pythagoras.jpg
      - web/portrety-matematici/eukleides.jpg
      - web/portrety-matematici/archimedes.jpg
      - web/portrety-matematici/fibonacci.jpg
      - web/portrety-matematici/descartes.jpg
      - web/portrety-matematici/pascal.jpg
      - web/portrety-matematici/newton.jpg
      - web/portrety-matematici/leibniz.jpg
      - web/portrety-matematici/euler.jpg
      - web/portrety-matematici/gauss.jpg
      - web/portrety-matematici/bolzano.jpg
      - web/portrety-matematici/lovelace.jpg
      - web/portrety-matematici/noether.jpg
  - name: vrskola-pisma      # přibalená písma sad (čínské znaky, podmnožina Noto Sans SC, OFL), hra je čte z /pisma/
    files:
      - web/pisma/cinstina.woff2
  - name: vrskola-strazcy   # samostatná hra pro tablet na /strazcy/ (bez VR, bez serveru)
    files:
      - web/strazcy/index.html
      - web/strazcy/styl.css
      - web/strazcy/hra.js
      - web/strazcy/mapa.js
      - web/strazcy/postava.js
      - web/strazcy/ulohy.js
      - web/strazcy/ulohy-ui.js
      - web/strazcy/nalepky.js
      - web/strazcy/zvuky.js
      - web/strazcy/manifest.json
      - web/strazcy/ikona.svg
  - name: vrskola-strazcy-data   # mapy a sady úkolů hry Strážcy klýčú (vyměnitelná data), servíruje se z /strazcy/data/
    files:
      - web/strazcy/data/mapy.json
      - web/strazcy/data/mapa-berounsko.json
      - web/strazcy/data/ukoly.json
      - web/strazcy/data/odmeny.json
      - web/strazcy/data/ukoly-pravopis.json
      - web/strazcy/data/ukoly-pady.json
      - web/strazcy/data/ukoly-pocty.json
      - web/strazcy/data/ukoly-anglictina.json
  - name: vrskola-padam   # samostatná hra pro tablet na /padam/ (určování pádů, bez VR, bez serveru)
    files:
      - web/padam/index.html
      - web/padam/styl.css
      - web/padam/hra.js
      - web/padam/spolecne.js
      - web/padam/pradnici.js
      - web/padam/vytah.js
      - web/padam/ptacek.js
      - web/padam/promeny.js
      - web/padam/detektiv.js
      - web/padam/zvuky.js
      - web/padam/manifest.json
      - web/padam/ikona.svg
  - name: vrskola-padam-data   # věty a slova hry Padám padám (vyměnitelná data), servíruje se z /padam/data/
    files:
      - web/padam/data/obsah.json
      - web/padam/data/vety.json
      - web/padam/data/ptacek.json
      - web/padam/data/promeny.json
  - name: vrskola-klavir   # samostatná aplikace Stupnice a sluch na /klavir/ (hudební teorie, klavír, PC/tablet i VR na Questu)
    files:
      - web/klavir/index.html
      - web/klavir/styl.css
      - web/klavir/main.js
      - web/klavir/hra.js
      - web/klavir/ui.js
      - web/klavir/vr.js
      - web/klavir/hudba.js
      - web/klavir/kurz.js
      - web/klavir/cviceni.js
      - web/klavir/postup.js
      - web/klavir/zvuk.js
      - web/klavir/manifest.json
      - web/klavir/ikona.svg
  - name: vrskola-zlomky   # samostatná hra Zlomková výprava na /zlomky/ (zlomky pro přijímačky, PC a tablet)
    files:
      - web/zlomky/index.html
      - web/zlomky/styl.css
      - web/zlomky/hra.js
      - web/zlomky/generatory.js
      - web/zlomky/zlomek.js
      - web/zlomky/kresby.js
      - web/zlomky/prisery.js
      - web/zlomky/postup.js
      - web/zlomky/zvuk.js
      - web/zlomky/vr.js
      - web/zlomky/manifest.json
      - web/zlomky/ikona.svg
  - name: vrskola-zlomky-data   # témata, lekce a úlohy Zlomkové výpravy (vyměnitelná data), servíruje se z /zlomky/data/
    files:
      - web/zlomky/data/kurz.json
      - web/zlomky/data/pojem.json
      - web/zlomky/data/kraceni.json
      - web/zlomky/data/porovnavani.json
      - web/zlomky/data/desetinna.json
      - web/zlomky/data/smisena.json
      - web/zlomky/data/scitani.json
      - web/zlomky/data/nasobeni.json
      - web/zlomky/data/deleni.json
      - web/zlomky/data/slozene.json
      - web/zlomky/data/slovni.json
  - name: vrskola-klavir2   # zkušební kopie /klavir/ s hraním prsty ve VR (sledování rukou na Questu)
    files:
      - web/klavir2/index.html
      - web/klavir2/styl.css
      - web/klavir2/main.js
      - web/klavir2/hra.js
      - web/klavir2/ui.js
      - web/klavir2/vr.js
      - web/klavir2/hudba.js
      - web/klavir2/kurz.js
      - web/klavir2/cviceni.js
      - web/klavir2/postup.js
      - web/klavir2/zvuk.js
      - web/klavir2/manifest.json
      - web/klavir2/ikona.svg
  - name: vrskola-zoo   # samostatná hra Slovní zoo na /zoo/ (slovní druhy, PC/tablet i VR na Questu)
    files:
      - web/zoo/index.html
      - web/zoo/styl.css
      - web/zoo/hra.js
      - web/zoo/ulohy.js
      - web/zoo/prisery.js
      - web/zoo/postup.js
      - web/zoo/zvuk.js
      - web/zoo/vr.js
      - web/zoo/manifest.json
      - web/zoo/ikona.svg
  - name: vrskola-zoo-data   # zvířata, slova, věty a výběhy Slovní zoo (vyměnitelná data), servíruje se z /zoo/data/
    files:
      - web/zoo/data/kurz.json
      - web/zoo/data/druhy.json
      - web/zoo/data/slova.json
      - web/zoo/data/vety.json
      - web/zoo/data/promeny.json
      - web/zoo/data/vybehy.json
  - name: vrskola-soustavy   # samostatná hra Dvojvrch na /soustavy/ (soustavy rovnic pro přijímačky, PC/tablet i VR na Questu)
    files:
      - web/soustavy/index.html
      - web/soustavy/styl.css
      - web/soustavy/hra.js
      - web/soustavy/generatory.js
      - web/soustavy/cisla.js
      - web/soustavy/kresby.js
      - web/soustavy/prisery.js
      - web/soustavy/postup.js
      - web/soustavy/zvuk.js
      - web/soustavy/vr.js
      - web/soustavy/manifest.json
      - web/soustavy/ikona.svg
  - name: vrskola-soustavy-data   # tábory, lekce, šablony slovních úloh a úlohy ve stylu přijímaček (vyměnitelná data), servíruje se z /soustavy/data/
    files:
      - web/soustavy/data/kurz.json
      - web/soustavy/data/jedna.json
      - web/soustavy/data/pojem.json
      - web/soustavy/data/vyjadreni.json
      - web/soustavy/data/dosazovaci.json
      - web/soustavy/data/scitaci.json
      - web/soustavy/data/upravy.json
      - web/soustavy/data/pocet.json
      - web/soustavy/data/slovni.json
      - web/soustavy/data/prijimacky.json
  - name: vrskola-nginx
    files:
      - deploy/default.conf
  - name: vrskola-api
    files:
      - server/server.mjs
      - web/sada.js
