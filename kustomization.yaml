# Nasazení VR školy do k3s. Žádný image se nestaví: soubory hry z web/ jdou do ConfigMapy
# a servíruje je neupravený nginx-unprivileged. Při změně web/ se změní hash ConfigMapy → Deployment se sám přerolluje.
#
# ConfigMapa má ~750 kB (víc než limit anotace last-applied), proto se aplikuje server-side:
#   kubectl apply --server-side -k .
# Flux (kustomize-controller) server-side apply používá sám.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vrskola
labels:
  - pairs:
      app.kubernetes.io/name: vrskola
    includeSelectors: true
resources:
  - deploy/namespace.yaml
  - deploy/deployment.yaml
  - deploy/service.yaml
  - deploy/ingress.yaml
  - deploy/api-pvc.yaml
  - deploy/api-deployment.yaml
  - deploy/api-service.yaml
configMapGenerator:
  - name: vrskola-web
    files:
      - web/index.html
      - web/sada.js
      - web/three.module.min.js
  - name: vrskola-sady      # sady zadání (co se procvičuje); hra je čte z /sady/, server souboje z /sady
    files:
      - web/sady/index.json
      - web/sady/vyjmenovana.json
      - web/sady/vybrane-slova.json
      - web/sady/shoda.json
      - web/sady/nasobilka.json
      - web/sady/anglictina.json
      - web/sady/cinstina.json
  - name: vrskola-portrety   # portréty do bludiště (~440 kB, české i slovenské), zvlášť kvůli limitu 1 MiB na ConfigMapu
    files:
      - web/portrety/hus.jpg
      - web/portrety/dobrovsky.jpg
      - web/portrety/jungmann.jpg
      - web/portrety/safarik.jpg
      - web/portrety/palacky.jpg
      - web/portrety/macha.jpg
      - web/portrety/nemcova.jpg
      - web/portrety/bernolak.jpg
      - web/portrety/stur.jpg
      - web/portrety/hurban.jpg
      - web/portrety/hodza.jpg
      - web/portrety/hattala.jpg
  - name: vrskola-pisma      # přibalená písma sad (čínské znaky, podmnožina Noto Sans SC, OFL), hra je čte z /pisma/
    files:
      - web/pisma/cinstina.woff2
  - name: vrskola-nginx
    files:
      - deploy/default.conf
  - name: vrskola-api
    files:
      - server/server.mjs
      - web/sada.js
