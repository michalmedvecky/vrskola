<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5fb3c9">
<title>Strážcy klýčú</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikona.svg">
<link rel="stylesheet" href="styl.css">
</head>
<body>
<canvas id="mapa"></canvas>

<div id="hud" hidden>
  <button id="brasna" class="hud-tl" aria-label="Brašnička">
    <span class="brasna-ikona">👜</span><span id="klice" class="klice"></span>
  </button>
  <div id="hrad-stav" class="hud-tl pasivni"></div>
  <div class="hud-vpravo">
    <button id="tl-album" class="hud-tl" aria-label="Sbírka nálepek">📒 <span id="pocet-nalepek">0</span></button>
    <button id="tl-nastaveni" class="hud-tl kulate" aria-label="Pro rodiče">⚙️</button>
  </div>
</div>
<div id="bublina" hidden></div>

<div id="panel" class="panel-obal" hidden>
  <div class="panel">
    <button id="panel-zavrit" class="zavrit" aria-label="Zavřít">✕</button>
    <div id="panel-obsah"></div>
  </div>
</div>

<div id="splash" class="splash" hidden>
  <div class="splash-nebe"></div>
  <div class="splash-obsah">
    <div class="splash-klice"><span>🗝️</span><span>🗝️</span><span>🗝️</span></div>
    <h1 class="splash-nazev">Strážcy klýčú</h1>
    <svg class="splash-hrad" viewBox="0 0 200 130" aria-hidden="true">
      <g fill="#d8cfc0" stroke="#a99f90" stroke-width="2"><rect x="30" y="50" width="140" height="80"/><rect x="18" y="30" width="34" height="100"/><rect x="148" y="30" width="34" height="100"/><rect x="80" y="14" width="40" height="50"/></g>
      <path d="M14 32L35 2L56 32ZM144 32L165 2L186 32ZM76 16L100-8L124 16Z" fill="#c0392b"/>
      <path d="M82 130V96a18 18 0 0 1 36 0V130Z" fill="#6d4c41"/>
      <rect x="91" y="104" width="18" height="15" rx="3" fill="#f5c518"/><path d="M95 104v-5a5 5 0 0 1 10 0v5" stroke="#7b5e57" stroke-width="3" fill="none"/>
    </svg>
    <div class="splash-stat"></div>
    <button class="tl velke hlavni splash-hrat">Hrát ▶</button>
  </div>
</div>

<div id="nacitani" class="nacitani">Chystám mapu…</div>
<div id="konfety"></div>

<script type="module" src="hra.js"></script>
</body>
</html>
